<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBZ 3.0 Prototypes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
  <link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/components.css">
  <style>
    body { margin: 0; padding: var(--space-24); background: var(--color-surface-subtle); font-family: var(--font-family-base); color: var(--color-text-body); }
    .home { max-width: 760px; margin: 0 auto; }
    .home__title { font-size: var(--font-size-title); font-weight: var(--font-weight-heading); margin: 0 0 var(--space-8); }
    .home__lead { color: var(--color-text-subtle); margin: 0 0 var(--space-24); line-height: var(--line-height-reading); }
    .home__list { display: flex; flex-direction: column; gap: var(--space-8); list-style: none; padding: 0; margin: 0; }
    .home__item a { display: block; padding: var(--space-16); background: var(--color-surface-base); border: var(--stroke-sm) var(--stroke-solid) var(--color-border-subtle); border-radius: var(--radius-lg); color: var(--color-text-body); text-decoration: none; }
    .home__item a:hover { border-color: var(--color-border-brand-subtle); }
    .home__empty { padding: var(--space-24); text-align: center; color: var(--color-text-subtle); background: var(--color-surface-base); border: var(--stroke-sm) dashed var(--color-border-subtle); border-radius: var(--radius-lg); }
  </style>
</head>
<body>
  <div class="home">
    <h1 class="home__title">KBZ 3.0 Prototypes</h1>
    <p class="home__lead">기능별 프로토타입 플로우 허브. 각 기능 폴더의 <code>flow-hub.html</code>에서 화면을 탐색합니다.</p>
    <!-- 기능이 추가되면 아래 목록에 링크를 넣는다. 예:
    <ul class="home__list">
      <li class="home__item"><a href="insurance-report/flow-hub.html">4대보험 신고</a></li>
    </ul>
    -->
    <div class="home__empty">아직 등록된 기능 프로토타입이 없습니다. <code>&lt;기능&gt;/flow-hub.html</code>을 만들고 이 목록에 링크를 추가하세요.</div>
  </div>
</body>
</html>
